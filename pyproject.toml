[project]
name = "lodestar-minecraft-server-studio"
version = "3.1.0"
description = "Import a Minecraft server ZIP and launch it from a local web studio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lodestar contributors" }]
keywords = ["minecraft", "server", "forge", "fabric", "paper", "web-panel"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Games/Entertainment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Nineu1124/lodestar-minecraft-server-studio"
Issues = "https://github.com/Nineu1124/lodestar-minecraft-server-studio/issues"
